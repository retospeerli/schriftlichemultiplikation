<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Schriftliche Multiplikation – 4. Klasse</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 2rem 2.5rem;
      max-width: 760px;
      width: 100%;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 1.6rem;
    }
    .subtitle {
      text-align: center;
      color: #4b5563;
      margin-bottom: 1.2rem;
      font-size: 0.95rem;
    }
    .hidden {
      display: none;
    }

    /* Startscreen */
    .section-title {
      text-align: center;
      margin-top: 0.5rem;
      font-weight: 600;
      color: #374151;
    }
    .mode-buttons {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }
    .mode-btn {
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: 2px solid #d1d5db;
      background: #f9fafb;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease, box-shadow 0.05s ease;
    }
    .mode-btn.selected {
      background: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;
      box-shadow: 0 5px 15px rgba(37,99,235,0.35);
    }
    .mode-btn:active {
      transform: translateY(1px);
    }
    .start-info {
      margin-top: 0.8rem;
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
      min-height: 1.4rem;
    }
    .primary-btn {
      margin-top: 1rem;
      width: 100%;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      background: #2563eb;
      color: white;
      transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.05s ease;
    }
    .primary-btn:hover {
      background: #1d4ed8;
    }
    .primary-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .primary-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Aufgabenlayout */
    .layout {
      display: grid;
      grid-template-columns: auto repeat(5, 3rem);
      gap: 0.25rem;
      align-items: center;
      justify-content: center;
      margin-top: 1rem;
    }
    .header-row {
      grid-column: 1 / span 6;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .label-cell {
      text-align: right;
      padding-right: 0.5rem;
      font-size: 0.9rem;
      color: #6b7280;
    }
    .digit-cell {
      text-align: center;
      font-size: 1.4rem;
      min-height: 2rem;
    }
    .line-row {
      grid-column: 1 / span 6;
      border-bottom: 2px solid #111827;
      margin-top: 0.2rem;
    }

    .input-digit {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 10px;
      border: 2px solid #d1d5db;
      font-size: 1.2rem;
      text-align: center;
      cursor: pointer;
      background: #f9fafb;
    }
    .input-digit:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.35);
    }
    .carry-input {
      width: 1.4rem;
      height: 1.1rem;
      font-size: 0.7rem; /* halb so gross */
      border-radius: 7px;
      padding: 0;
    }
    .input-digit.correct {
      border-color: #16a34a;
      background: #dcfce7;
    }
    .input-digit.incorrect {
      border-color: #b91c1c;
      background: #fee2e2;
    }

    .buttons-row {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .secondary-btn {
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      background: #f9fafb;
      color: #111827;
      transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.05s ease, border-color 0.15s ease;
    }
    .secondary-btn:hover {
      background: #e5e7eb;
      border-color: #9ca3af;
    }
    .secondary-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .feedback {
      margin-top: 0.8rem;
      text-align: center;
      min-height: 1.4rem;
      font-weight: 500;
    }
    .feedback.ok {
      color: #15803d;
    }
    .feedback.error {
      color: #b91c1c;
    }

    /* Popup-Ziffern-Auswahl */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .popup {
      background: #ffffff;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 320px;
      width: 100%;
    }
    .popup-title {
      text-align: center;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .digit-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .digit-btn {
      padding: 0.4rem 0;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.1s ease, transform 0.05s ease;
    }
    .digit-btn:hover {
      background: #e5e7eb;
    }
    .digit-btn:active {
      transform: translateY(1px);
    }
    .popup-footer {
      text-align: center;
    }
    .popup-close {
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      border: none;
      background: #e5e7eb;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .popup-close:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Schriftliche Multiplikation</h1>
  <div class="subtitle">
    4. Klasse – einstelliger oder zweistelliger Faktor × drei- oder vierstellige Zahl<br>
    Nur in der obersten Zeile steht die Aufgabe, darunter sind nur Eingabefelder.
  </div>

  <!-- Start-Bildschirm -->
  <div id="start-screen">
    <div class="section-title">Niveau wählen</div>
    <div class="mode-buttons">
      <button type="button" class="mode-btn" data-mode="1digit">Einstelliger Faktor</button>
      <button type="button" class="mode-btn" data-mode="2digit">Zweistelliger Faktor</button>
    </div>
    <div class="start-info" id="start-info">
      Bitte ein Niveau auswählen.
    </div>
    <button class="primary-btn" id="start-btn" disabled>Los!</button>
  </div>

  <!-- Aufgaben-Bildschirm -->
  <div id="exercise-screen" class="hidden">
    <div id="mode-text"
         style="text-align:center; font-size:0.95rem; color:#4b5563; margin-bottom:0.4rem;">
    </div>

    <!-- Layout: einstelliger Faktor -->
    <div id="layout-1digit" class="layout hidden">
      <!-- Zeile 1: Aufgabe -->
      <div class="header-row" id="header-1digit"></div>

      <!-- Zeile 2: Endergebnis (nur Eingabefelder) -->
      <div class="label-cell"></div>
      <div class="digit-cell"><input class="input-digit res1-input" data-col="0" readonly></div>
      <div class="digit-cell"><input class="input-digit res1-input" data-col="1" readonly></div>
      <div class="digit-cell"><input class="input-digit res1-input" data-col="2" readonly></div>
      <div class="digit-cell"><input class="input-digit res1-input" data-col="3" readonly></div>
      <div class="digit-cell"><input class="input-digit res1-input" data-col="4" readonly></div>
    </div>

    <!-- Layout: zweistelliger Faktor -->
    <div id="layout-2digit" class="layout hidden">
      <!-- Zeile 1: Aufgabe -->
      <div class="header-row" id="header-2digit"></div>

      <!-- Zeile 2: erstes Zwischenprodukt (Einserstelle) -->
      <div class="label-cell"></div>
      <div class="digit-cell"><input class="input-digit p1-input" data-col="0" readonly></div>
      <div class="digit-cell"><input class="input-digit p1-input" data-col="1" readonly></div>
      <div class="digit-cell"><input class="input-digit p1-input" data-col="2" readonly></div>
      <div class="digit-cell"><input class="input-digit p1-input" data-col="3" readonly></div>
      <div class="digit-cell"><input class="input-digit p1-input" data-col="4" readonly></div>

      <!-- Zeile 3: zweites Zwischenprodukt (Zehnerstelle, stellenversetzt) -->
      <div class="label-cell"></div>
      <div class="digit-cell"><input class="input-digit p2-input" data-col="0" readonly></div>
      <div class="digit-cell"><input class="input-digit p2-input" data-col="1" readonly></div>
      <div class="digit-cell"><input class="input-digit p2-input" data-col="2" readonly></div>
      <div class="digit-cell"><input class="input-digit p2-input" data-col="3" readonly></div>
      <div class="digit-cell"><input class="input-digit p2-input" data-col="4" readonly></div>

      <!-- Zeile 4: Behaltezahlen für Addition (klein, keine Einerstelle) -->
      <div class="label-cell"></div>
      <div class="digit-cell"><input class="input-digit carry-input" data-col="0" readonly></div>
      <div class="digit-cell"><input class="input-digit carry-input" data-col="1" readonly></div>
      <div class="digit-cell"><input class="input-digit carry-input" data-col="2" readonly></div>
      <div class="digit-cell"><input class="input-digit carry-input" data-col="3" readonly></div>
      <div class="digit-cell"><!-- keine Behalte bei Einern --></div>

      <!-- Rechenstrich -->
      <div class="line-row"></div>

      <!-- Zeile 5: Endergebnis (Summe der Zwischenprodukte) -->
      <div class="label-cell"></div>
      <div class="digit-cell"><input class="input-digit res2-input" data-col="0" readonly></div>
      <div class="digit-cell"><input class="input-digit res2-input" data-col="1" readonly></div>
      <div class="digit-cell"><input class="input-digit res2-input" data-col="2" readonly></div>
      <div class="digit-cell"><input class="input-digit res2-input" data-col="3" readonly></div>
      <div class="digit-cell"><input class="input-digit res2-input" data-col="4" readonly></div>
    </div>

    <div class="buttons-row">
      <button class="secondary-btn" id="new-btn">Neue Aufgabe</button>
      <button class="secondary-btn" id="check-btn">Überprüfen</button>
      <button class="secondary-btn" id="done-btn">Erledigt</button>
      <button class="secondary-btn" id="back-btn">Zurück zur Auswahl</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>
</div>

<!-- Popup für Ziffernauswahl -->
<div class="popup-overlay" id="popup-overlay">
  <div class="popup">
    <div class="popup-title">Ziffer auswählen</div>
    <div class="digit-grid" id="digit-grid">
      <!-- Ziffern-Buttons werden per JS erzeugt -->
    </div>
    <div class="popup-footer">
      <button class="popup-close" id="popup-close-btn">Abbrechen</button>
    </div>
  </div>
</div>

<script>
  const NUM_COLS = 5; // Zehntausender bis Einer, Ergebnis < 20001

  let factorMode = null;   // '1digit' oder '2digit'
  let smallFactor = 0;     // einstelliger oder zweistelliger Faktor
  let bigFactor = 0;       // 3- oder 4-stellige Zahl

  let resultDigits = [];
  let carryDigits = [];    // Behalte (nur bei 2digit)
  let partial1Digits = []; // Zwischenprodukt Einserstelle
  let partial2Digits = []; // Zwischenprodukt Zehnerstelle (stellenversetzt)

  let activeInput = null;

  // Startscreen-Elemente
  const startScreen = document.getElementById('start-screen');
  const exerciseScreen = document.getElementById('exercise-screen');
  const startBtn = document.getElementById('start-btn');
  const startInfo = document.getElementById('start-info');
  const modeButtons = Array.from(document.querySelectorAll('.mode-btn'));

  // Info-Text
  const modeText = document.getElementById('mode-text');

  // Layouts
  const layout1 = document.getElementById('layout-1digit');
  const layout2 = document.getElementById('layout-2digit');
  const header1 = document.getElementById('header-1digit');
  const header2 = document.getElementById('header-2digit');

  // Eingabefelder
  const res1Inputs = Array.from(document.querySelectorAll('.res1-input'));
  const p1Inputs   = Array.from(document.querySelectorAll('.p1-input'));
  const p2Inputs   = Array.from(document.querySelectorAll('.p2-input'));
  const carryInputs = Array.from(document.querySelectorAll('.carry-input'));
  const res2Inputs = Array.from(document.querySelectorAll('.res2-input'));

  const newBtn = document.getElementById('new-btn');
  const checkBtn = document.getElementById('check-btn');
  const doneBtn = document.getElementById('done-btn');
  const backBtn = document.getElementById('back-btn');
  const feedbackEl = document.getElementById('feedback');

  // Popup
  const popupOverlay = document.getElementById('popup-overlay');
  const digitGrid = document.getElementById('digit-grid');
  const popupCloseBtn = document.getElementById('popup-close-btn');

  /* --- Start-Auswahl --- */

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      factorMode = btn.getAttribute('data-mode');
      modeButtons.forEach(b => b.classList.toggle('selected', b === btn));
      updateStartState();
    });
  });

  function updateStartState() {
    if (!factorMode) {
      startInfo.textContent = 'Bitte ein Niveau auswählen.';
      startBtn.disabled = true;
      return;
    }
    if (factorMode === '1digit') {
      startInfo.textContent = 'Einstelliger Faktor · drei- oder vierstellige Zahl – nur Endergebnis eintragen.';
    } else {
      startInfo.textContent = 'Zweistelliger Faktor · drei- oder vierstellige Zahl – zwei Zwischenprodukte, dann Behalte und Endergebnis.';
    }
    startBtn.disabled = false;
  }

  startBtn.addEventListener('click', () => {
    if (!factorMode) return;
    startScreen.classList.add('hidden');
    exerciseScreen.classList.remove('hidden');
    generateProblem();
  });

  backBtn.addEventListener('click', () => {
    exerciseScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
  });

  /* --- Popup für Ziffern --- */

  function buildDigitButtons() {
    digitGrid.innerHTML = '';
    for (let d = 0; d <= 9; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'digit-btn';
      btn.textContent = String(d);
      btn.addEventListener('click', () => {
        if (activeInput) {
          activeInput.value = String(d);
          activeInput.focus();
        }
        hidePopup();
      });
      digitGrid.appendChild(btn);
    }
  }

  function showPopupForInput(inputEl) {
    activeInput = inputEl;
    popupOverlay.style.display = 'flex';
  }

  function hidePopup() {
    popupOverlay.style.display = 'none';
    activeInput = null;
  }

  popupCloseBtn.addEventListener('click', hidePopup);
  popupOverlay.addEventListener('click', (e) => {
    if (e.target === popupOverlay) {
      hidePopup();
    }
  });

  function setupInputClicks() {
    const allInputs = Array.from(document.querySelectorAll('.input-digit'));
    allInputs.forEach(inp => {
      inp.addEventListener('click', () => {
        inp.classList.remove('correct', 'incorrect');
        showPopupForInput(inp);
      });
    });
  }

  /* --- Hilfsfunktionen --- */

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function digitsOf(num) {
    const arr = new Array(NUM_COLS).fill(0);
    let n = Math.floor(Math.abs(num));
    for (let i = NUM_COLS - 1; i >= 0; i--) {
      arr[i] = n % 10;
      n = Math.floor(n / 10);
    }
    return arr;
  }

  function resetAllInputs() {
    const allInputs = Array.from(document.querySelectorAll('.input-digit'));
    allInputs.forEach(inp => {
      inp.value = '';
      inp.classList.remove('correct', 'incorrect');
    });
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
  }

  /* --- Aufgaben-Generierung --- */

  function generateProblem() {
    if (factorMode === '1digit') {
      generateOneDigitProblem();
    } else {
      generateTwoDigitProblem();
    }
  }

  function generateOneDigitProblem() {
    modeText.textContent = 'Schriftliche Multiplikation mit einem einstelligen Faktor (ohne Behaltezahlen).';
    layout1.classList.remove('hidden');
    layout2.classList.add('hidden');

    let product;
    do {
      smallFactor = randomInt(2, 9);      // einstelliger Faktor
      bigFactor = randomInt(100, 9999);  // 3–4-stellige Zahl
      product = smallFactor * bigFactor;
    } while (product > 20000);

    header1.textContent = smallFactor + ' · ' + bigFactor;

    resultDigits = digitsOf(product);
    carryDigits = new Array(NUM_COLS).fill(0); // wird nicht verwendet

    resetAllInputs();
  }

  function generateTwoDigitProblem() {
    modeText.textContent = 'Schriftliche Multiplikation mit einem zweistelligen Faktor (zwei Zwischenprodukte, dann Addition).';
    layout1.classList.add('hidden');
    layout2.classList.remove('hidden');

    let product;
    do {
      smallFactor = randomInt(10, 99);       // zweistellig
      bigFactor = randomInt(100, 9999);      // 3–4-stellig
      product = smallFactor * bigFactor;
    } while (product > 20000);

    header2.textContent = smallFactor + ' · ' + bigFactor;

    const ones = smallFactor % 10;
    const tens = Math.floor(smallFactor / 10);

    const partial1 = bigFactor * ones;
    const partial2 = bigFactor * tens * 10;  // bereits stellenversetzt

    partial1Digits = digitsOf(partial1);
    partial2Digits = digitsOf(partial2);

    const sum = partial1 + partial2;
    resultDigits = digitsOf(sum);

    // Behaltezahlen für die Addition der beiden Zwischenprodukte
    carryDigits = new Array(NUM_COLS).fill(0);
    let carryIn = 0;
    for (let i = NUM_COLS - 1; i >= 0; i--) {
      const s = partial1Digits[i] + partial2Digits[i] + carryIn;
      const digit = s % 10;
      const carryOut = Math.floor(s / 10);
      resultDigits[i] = digitsOf(sum)[i]; // Sicher gehen
      if (i - 1 >= 0) {
        carryDigits[i - 1] = carryOut;
      }
      carryIn = carryOut;
    }

    resetAllInputs();
  }

  /* --- Lösung prüfen --- */

  function checkSolution() {
    let allCorrect = true;

    if (factorMode === '1digit') {
      // Nur Ergebnis-Reihe wird geprüft
      res1Inputs.forEach(inp => {
        const col = parseInt(inp.getAttribute('data-col'), 10);
        const expected = resultDigits[col];
        const value = inp.value === '' ? 0 : parseInt(inp.value, 10);

        inp.classList.remove('correct', 'incorrect');
        if (value === expected) {
          inp.classList.add('correct');
        } else {
          inp.classList.add('incorrect');
          allCorrect = false;
        }
      });
    } else {
      // Zweistelliger Faktor: Zwischenprodukte, Behalte, Endergebnis

      // p1 (Einser-Zwischenprodukt)
      p1Inputs.forEach(inp => {
        const col = parseInt(inp.getAttribute('data-col'), 10);
        const expected = partial1Digits[col];
        const value = inp.value === '' ? 0 : parseInt(inp.value, 10);

        inp.classList.remove('correct', 'incorrect');
        if (value === expected) {
          inp.classList.add('correct');
        } else {
          inp.classList.add('incorrect');
          allCorrect = false;
        }
      });

      // p2 (Zehner-Zwischenprodukt)
      p2Inputs.forEach(inp => {
        const col = parseInt(inp.getAttribute('data-col'), 10);
        const expected = partial2Digits[col];
        const value = inp.value === '' ? 0 : parseInt(inp.value, 10);

        inp.classList.remove('correct', 'incorrect');
        if (value === expected) {
          inp.classList.add('correct');
        } else {
          inp.classList.add('incorrect');
          allCorrect = false;
        }
      });

      // Behaltezahlen (Addition der Zwischenprodukte), leeres Feld = 0
      carryInputs.forEach(inp => {
        const col = parseInt(inp.getAttribute('data-col'), 10);
        const expected = carryDigits[col];
        const value = inp.value === '' ? 0 : parseInt(inp.value, 10);

        inp.classList.remove('correct', 'incorrect');
        if (value === expected) {
          inp.classList.add('correct');
        } else {
          inp.classList.add('incorrect');
          allCorrect = false;
        }
      });

      // Endergebnis
      res2Inputs.forEach(inp => {
        const col = parseInt(inp.getAttribute('data-col'), 10);
        const expected = resultDigits[col];
        const value = inp.value === '' ? 0 : parseInt(inp.value, 10);

        inp.classList.remove('correct', 'incorrect');
        if (value === expected) {
          inp.classList.add('correct');
        } else {
          inp.classList.add('incorrect');
          allCorrect = false;
        }
      });
    }

    if (allCorrect) {
      feedbackEl.textContent = 'Super, alles korrekt gelöst! 🎉';
      feedbackEl.className = 'feedback ok';
    } else {
      feedbackEl.textContent = 'Einige Ziffern sind noch falsch. Versuche es zu verbessern.';
      feedbackEl.className = 'feedback error';
    }
  }

  /* --- "Erledigt" an LearningView melden --- */

  function markDone() {
    feedbackEl.textContent = 'Aufgabe als erledigt markiert. (LearningView wird informiert, falls eingebunden.)';
    feedbackEl.className = 'feedback ok';

    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          {
            type: 'lv_task_done',
            status: 'completed',
            mode: factorMode
          },
          '*'
        );
      }
    } catch (e) {
      console.error('Senden an Parent fehlgeschlagen:', e);
    }
  }

  /* --- Events --- */

  newBtn.addEventListener('click', generateProblem);
  checkBtn.addEventListener('click', checkSolution);
  doneBtn.addEventListener('click', markDone);

  // Initialisierung
  buildDigitButtons();
  setupInputClicks();
</script>
</body>
</html>
