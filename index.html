<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Schriftliche Multiplikation – 4. Klasse</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 2rem 2.5rem;
      max-width: 720px;
      width: 100%;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 1.6rem;
    }
    .subtitle {
      text-align: center;
      color: #4b5563;
      margin-bottom: 1.2rem;
      font-size: 0.95rem;
    }

    .layout {
      display: grid;
      grid-template-columns: auto repeat(5, 3rem);
      gap: 0.25rem;
      align-items: center;
      justify-content: center;
      margin-top: 1rem;
    }
    .label-cell {
      text-align: right;
      padding-right: 0.5rem;
      font-size: 0.9rem;
      color: #6b7280;
    }
    .digit-cell {
      text-align: center;
      font-size: 1.4rem;
      min-height: 2rem;
    }
    .digit-cell span {
      display: inline-block;
      min-width: 2rem;
    }
    .line-row {
      grid-column: 1 / span 6;
      border-bottom: 2px solid #111827;
      margin-top: 0.2rem;
    }
    .input-digit {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 10px;
      border: 2px solid #d1d5db;
      font-size: 1.2rem;
      text-align: center;
      cursor: pointer;
      background: #f9fafb;
    }
    .input-digit:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.35);
    }
    .carry-input {
      width: 1.4rem;
      height: 1.1rem;
      font-size: 0.7rem; /* halb so gross */
      border-radius: 7px;
      padding: 0;
    }
    .input-digit.correct {
      border-color: #16a34a;
      background: #dcfce7;
    }
    .input-digit.incorrect {
      border-color: #b91c1c;
      background: #fee2e2;
    }

    .buttons-row {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .primary-btn, .secondary-btn {
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.05s ease;
    }
    .primary-btn {
      background: #2563eb;
      color: white;
      width: 100%;
      margin-top: 0.6rem;
    }
    .primary-btn:hover {
      background: #1d4ed8;
    }
    .primary-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .secondary-btn {
      background: #f9fafb;
      border: 1px solid #d1d5db;
      color: #111827;
    }
    .secondary-btn:hover {
      background: #e5e7eb;
      border-color: #9ca3af;
    }
    .secondary-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .feedback {
      margin-top: 0.8rem;
      text-align: center;
      min-height: 1.4rem;
      font-weight: 500;
    }
    .feedback.ok {
      color: #15803d;
    }
    .feedback.error {
      color: #b91c1c;
    }

    /* Popup-Ziffern-Auswahl */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .popup {
      background: #ffffff;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 320px;
      width: 100%;
    }
    .popup-title {
      text-align: center;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .digit-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .digit-btn {
      padding: 0.4rem 0;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.1s ease, transform 0.05s ease;
    }
    .digit-btn:hover {
      background: #e5e7eb;
    }
    .digit-btn:active {
      transform: translateY(1px);
    }
    .popup-footer {
      text-align: center;
    }
    .popup-close {
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      border: none;
      background: #e5e7eb;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .popup-close:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Schriftliche Multiplikation</h1>
  <div class="subtitle">
    4. Klasse – einstelliger Faktor × drei- oder vierstellige Zahl<br>
    Klicke in die Behalte- und Ergebnisfelder und wähle die Ziffern aus.
  </div>

  <div class="layout">
    <!-- Zeile 1: großer Faktor (3–4-stellig) -->
    <div class="label-cell"></div>
    <div class="digit-cell"><span id="top-0"></span></div>
    <div class="digit-cell"><span id="top-1"></span></div>
    <div class="digit-cell"><span id="top-2"></span></div>
    <div class="digit-cell"><span id="top-3"></span></div>
    <div class="digit-cell"><span id="top-4"></span></div>

    <!-- Zeile 2: einstelliger Faktor (rechtsbündig) -->
    <div class="label-cell">×</div>
    <div class="digit-cell"><span id="mul-0"></span></
