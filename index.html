<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Schriftliche Multiplikation – 3-stellig × 2-stellig</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
      background: #f3f4f6;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 2rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 1.4rem;
    }
    .subtitle {
      text-align: center;
      color: #4b5563;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: auto repeat(6, 2.4rem);
      gap: 0.12rem;
      align-items: center;
    }
    .task-digit {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 600;
      min-height: 2rem;
    }
    .op-cell-empty {
      min-width: 2rem;
    }

    .place-label {
      font-weight: 700;
      font-size: 0.8rem;
    }
    .t { color: #22c55e; }
    .h { color: #ef4444; }
    .z { color: #3b82f6; }
    .e { color: #22c55e; }

    .input-digit {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      border: 2px solid #d1d5db;
      font-size: 1.1rem;
      background: #f9fafb;
      cursor: pointer;
      text-align: center;
    }
    .input-digit.correct {
      border-color: #16a34a;
      background: #dcfce7;
    }
    .input-digit.incorrect {
      border-color: #b91c1c;
      background: #fee2e2;
    }

    .carry-input {
      width: 1.25rem;
      height: 1rem;
      font-size: 0.7rem;
      border-radius: 6px;
      padding: 0;
    }

    .line-row {
      grid-column: 1 / span 7;
      border-bottom: 2px solid #111;
      margin: 0.15rem 0;
    }

    .buttons-row {
      margin-top: 1.2rem;
      display:flex;
      gap:0.5rem;
      justify-content:center;
    }
    .btn {
      padding:0.45rem 1.1rem;
      border-radius:999px;
      background:#f9fafb;
      border:1px solid #d1d5db;
      cursor:pointer;
      font-weight:600;
    }
    .feedback {
      text-align:center;
      margin-top:0.4rem;
      min-height:1.2rem;
      font-weight:500;
    }

    /* Popup */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display:none;
      align-items:center;
      justify-content:center;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Schriftliche Multiplikation</h1>
  <div class="subtitle">3-stelliger Faktor × 2-stelliger Faktor</div>

  <div class="layout">

    <!-- Zeile 1: Ziffern der Aufgabe -->
    <div></div>
    <div class="task-digit" id="d0"></div>
    <div class="task-digit" id="d1"></div>
    <div class="task-digit" id="d2"></div>
    <div class="task-digit">·</div>
    <div class="task-digit" id="d3"></div>
    <div class="task-digit" id="d4"></div>

    <!-- Zeile 2: Stellenwerte THZE -->
    <div></div>
    <div class="task-digit"><span class="place-label t">T</span></div>
    <div class="task-digit"><span class="place-label h">H</span></div>
    <div class="task-digit"><span class="place-label z">Z</span></div>
    <div class="task-digit op-cell-empty"></div>
    <div class="task-digit"><span class="place-label z">Z</span></div>
    <div class="task-digit"><span class="place-label e">E</span></div>

    <!-- Zeile 3: Zwischenprodukt 1 -->
    <div></div>
    <input class="input-digit p1" data-col="0" readonly>
    <input class="input-digit p1" data-col="1" readonly>
    <input class="input-digit p1" data-col="2" readonly>
    <input class="input-digit p1" data-col="3" readonly>
    <input class="input-digit p1" data-col="4" readonly>
    <input class="input-digit p1" data-col="5" readonly>

    <!-- Zeile 4: Zwischenprodukt 2 -->
    <div></div>
    <input class="input-digit p2" data-col="0" readonly>
    <input class="input-digit p2" data-col="1" readonly>
    <input class="input-digit p2" data-col="2" readonly>
    <input class="input-digit p2" data-col="3" readonly>
    <input class="input-digit p2" data-col="4" readonly>
    <input class="input-digit p2" data-col="5" readonly>

    <!-- Zeile 5: Behaltezahlen -->
    <div></div>
    <input class="input-digit carry-input c" data-col="0" readonly>
    <input class="input-digit carry-input c" data-col="1" readonly>
    <input class="input-digit carry-input c" data-col="2" readonly>
    <input class="input-digit carry-input c" data-col="3" readonly>
    <input class="input-digit carry-input c" data-col="4" readonly>
    <div></div>

    <!-- Linie -->
    <div class="line-row"></div>

    <!-- Ergebnis -->
    <div></div>
    <input class="input-digit r" data-col="0" readonly>
    <input class="input-digit r" data-col="1" readonly>
    <input class="input-digit r" data-col="2" readonly>
    <input class="input-digit r" data-col="3" readonly>
    <input class="input-digit r" data-col="4" readonly>
    <input class="input-digit r" data-col="5" readonly>

  </div>

  <div class="buttons-row">
    <button class="btn" id="new">Neue Aufgabe</button>
    <button class="btn" id="check">Überprüfen</button>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<!-- Popup generiere ich hier nicht komplett, weil du es schon hast 😉 -->

<script>
/* ——— JavaScript identisch zur letzten Version, außer: ———
   Die Ziffern werden jetzt in #d0 bis #d4 geschrieben!
*/

const d = [...Array(5)].map((_,i)=>document.getElementById("d"+i));
// Rest bleibt gleich:
</script>

</body>
</html>
