<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Schriftliche Multiplikation – 2-stellig × 4-stellig</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
      background: #f3f4f6;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 2rem 2.5rem;
      max-width: 520px;
      width: 100%;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 1.4rem;
    }
    .subtitle {
      text-align: center;
      color: #4b5563;
      margin-bottom: 0.8rem;
      font-size: 0.9rem;
    }

    .task-line {
      text-align: center;
      font-size: 1.7rem;   /* gross wie gewünscht */
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    .layout {
      display: grid;
      grid-template-columns: auto repeat(5, 2.4rem);
      gap: 0.12rem;
      align-items: center;
      justify-content: center;
    }
    .label-cell {
      text-align: right;
      padding-right: 0.4rem;
      font-size: 1.2rem;
      color: #111827;
      min-height: 2rem;
    }
    .digit-cell {
      text-align: center;
      font-size: 1.2rem;
      min-height: 2rem;
    }
    .factor2-digit {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .input-digit {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      border: 2px solid #d1d5db;
      font-size: 1.1rem;
      background: #f9fafb;
      cursor: pointer;
      text-align: center;
    }
    .input-digit.correct {
      border-color: #16a34a;
      background: #dcfce7;
    }
    .input-digit.incorrect {
      border-color: #b91c1c;
      background: #fee2e2;
    }
    .carry-input {
      width: 1.25rem;
      height: 1rem;
      font-size: 0.7rem;
      border-radius: 6px;
      padding: 0;
    }

    .line-row {
      grid-column: 1 / span 6;
      border-bottom: 2px solid #111827;
      margin: 0.15rem 0;
    }

    .buttons-row {
      margin-top: 1.2rem;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.45rem 1.1rem;
      border-radius: 999px;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .btn:hover {
      background: #e5e7eb;
      border-color: #9ca3af;
    }
    .feedback {
      text-align: center;
      margin-top: 0.4rem;
      min-height: 1.2rem;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .feedback.ok { color: #15803d; }
    .feedback.error { color: #b91c1c; }

    /* Popup */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .popup {
      background: #ffffff;
      border-radius: 14px;
      padding: 0.8rem 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 260px;
      width: 100%;
    }
    .popup-title {
      text-align: center;
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }
    .digit-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 0.3rem;
      margin-bottom: 0.4rem;
    }
    .digit-btn {
      padding: 0.3rem 0;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .digit-btn:hover {
      background: #e5e7eb;
    }
    .popup-footer {
      text-align: center;
    }
    .popup-close {
      padding: 0.25rem 0.8rem;
      border-radius: 999px;
      border: none;
      background: #e5e7eb;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .popup-close:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Schriftliche Multiplikation</h1>
  <div class="subtitle">2-stelliger Faktor × 4-stelliger Faktor</div>

  <!-- Aufgabe gross zur Orientierung -->
  <div class="task-line" id="task-line"></div>

  <!-- Raster: links 1. Faktor, darüber 2. Faktor über den Spalten -->
  <div class="layout">

    <!-- Zeile 1: erster Faktor links, zweiter Faktor stellengetreu über den Spalten -->
    <div class="label-cell" id="factor1-cell"></div>
    <div class="digit-cell factor2-digit" id="f2-0"></div>
    <div class="digit-cell factor2-digit" id="f2-1"></div>
    <div class="digit-cell factor2-digit" id="f2-2"></div>
    <div class="digit-cell factor2-digit" id="f2-3"></div>
    <div class="digit-cell factor2-digit" id="f2-4"></div>

    <!-- Zeile 2: Zwischenprodukt 1 (Einserstelle des 1. Faktors) -->
    <div class="label-cell"></div>
    <input class="input-digit p1" data-col="0" readonly>
    <input class="input-digit p1" data-col="1" readonly>
    <input class="input-digit p1" data-col="2" readonly>
    <input class="input-digit p1" data-col="3" readonly>
    <input class="input-digit p1" data-col="4" readonly>

    <!-- Zeile 3: Zwischenprodukt 2 (Zehnerstelle, um eine Stelle nach links versetzt) -->
    <div class="label-cell"></div>
    <input class="input-digit p2" data-col="0" readonly>
    <input class="input-digit p2" data-col="1" readonly>
    <input class="input-digit p2" data-col="2" readonly>
    <input class="input-digit p2" data-col="3" readonly>
    <input class="input-digit p2" data-col="4" readonly>

    <!-- Zeile 4: Behaltezahlen (Addition), keine Einerstelle -->
    <div class="label-cell"></div>
    <input class="input-digit carry-input c" data-col="0" readonly>
    <input class="input-digit carry-input c" data-col="1" readonly>
    <input class="input-digit carry-input c" data-col="2" readonly>
    <input class="input-digit carry-input c" data-col="3" readonly>
    <div></div>

    <!-- Strich -->
    <div class="line-row"></div>

    <!-- Zeile 5: Endergebnis -->
    <div class="label-cell"></div>
    <input class="input-digit r" data-col="0" readonly>
    <input class="input-digit r" data-col="1" readonly>
    <input class="input-digit r" data-col="2" readonly>
    <input class="input-digit r" data-col="3" readonly>
    <input class="input-digit r" data-col="4" readonly>
  </div>

  <div class="buttons-row">
    <button class="btn" id="new-btn">Neue Aufgabe</button>
    <button class="btn" id="check-btn">Überprüfen</button>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<!-- Popup für Ziffernauswahl -->
<div class="popup-overlay" id="popup-overlay">
  <div class="popup">
    <div class="popup-title">Ziffer auswählen</div>
    <div class="digit-grid" id="digit-grid"></div>
    <div class="popup-footer">
      <button class="popup-close" id="popup-close-btn">Abbrechen</button>
    </div>
  </div>
</div>

<script>
  const NUM_COLS = 5; // bis 99 999

  let factor1 = 0;       // 2-stellig
  let factor2 = 0;       // 4-stellig
  let partial1Digits = [];
  let partial2Digits = [];
  let carryDigits   = [];
  let resultDigits  = [];

  let activeInput = null;

  const taskLine = document.getElementById('task-line');
  const factor1Cell = document.getElementById('factor1-cell');
  const f2Cells = [...Array(NUM_COLS)].map((_, i) =>
    document.getElementById('f2-' + i)
  );

  const p1Inputs = Array.from(document.querySelectorAll('.p1'));
  const p2Inputs = Array.from(document.querySelectorAll('.p2'));
  const carryInputs = Array.from(document.querySelectorAll('.c'));
  const resInputs = Array.from(document.querySelectorAll('.r'));

  const newBtn = document.getElementById('new-btn');
  const checkBtn = document.getElementById('check-btn');
  const feedbackEl = document.getElementById('feedback');

  const popupOverlay = document.getElementById('popup-overlay');
  const digitGrid = document.getElementById('digit-grid');
  const popupCloseBtn = document.getElementById('popup-close-btn');

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function digitsOf(num) {
    const arr = new Array(NUM_COLS).fill(0);
    let n = Math.floor(Math.abs(num));
    for (let i = NUM_COLS - 1; i >= 0; i--) {
      arr[i] = n % 10;
      n = Math.floor(n / 10);
    }
    return arr;
  }

  function resetInputs() {
    [...p1Inputs, ...p2Inputs, ...carryInputs, ...resInputs].forEach(inp => {
      inp.value = '';
      inp.classList.remove('correct', 'incorrect');
    });
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
  }

  function buildDigitButtons() {
    digitGrid.innerHTML = '';
    for (let d = 0; d <= 9; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'digit-btn';
      btn.textContent = String(d);
      btn.addEventListener('click', () => {
        if (activeInput) activeInput.value = String(d);
        hidePopup();
      });
      digitGrid.appendChild(btn);
    }
  }

  function showPopupForInput(inputEl) {
    activeInput = inputEl;
    popupOverlay.style.display = 'flex';
  }

  function hidePopup() {
    popupOverlay.style.display = 'none';
    activeInput = null;
  }

  popupCloseBtn.addEventListener('click', hidePopup);
  popupOverlay.addEventListener('click', (e) => {
    if (e.target === popupOverlay) hidePopup();
  });

  function setupInputClicks() {
    const allInputs = [...p1Inputs, ...p2Inputs, ...carryInputs, ...resInputs];
    allInputs.forEach(inp => {
      inp.addEventListener('click', () => {
        inp.classList.remove('correct', 'incorrect');
        showPopupForInput(inp);
      });
    });
  }

  // Zweiter Faktor (vierstellig) soll über den 4 rechten Spalten stehen.
  function displaySecondFactorDigits() {
    const str = factor2.toString().padStart(4, '0');
    const digs = str.split('').map(ch => parseInt(ch, 10));
    for (let col = 0; col < NUM_COLS; col++) {
      if (col < NUM_COLS - 4) {
        f2Cells[col].textContent = '';       // linke "freie" Spalte
      } else {
        f2Cells[col].textContent = digs[col - (NUM_COLS - 4)];
      }
    }
  }

  function generateProblem() {
    let product;
    do {
      factor1 = randomInt(10, 99);      // zweistellig
      factor2 = randomInt(1000, 9999);  // vierstellig
      product = factor1 * factor2;
    } while (product > 99999); // Ergebnis 5-stellig begrenzen

    taskLine.textContent = factor1 + ' · ' + factor2;
    factor1Cell.textContent = factor1 + ' ·'; // links ausserhalb der Spalten
    displaySecondFactorDigits();

    const ones = factor1 % 10;
    const tens = Math.floor(factor1 / 10);

    const partial1 = factor2 * ones;
    const partial2 = factor2 * tens * 10; // Zehnerstelle, um eine Stelle verschoben

    partial1Digits = digitsOf(partial1);
    partial2Digits = digitsOf(partial2);

    const sum = partial1 + partial2;
    resultDigits = digitsOf(sum);

    carryDigits = new Array(NUM_COLS).fill(0);
    let carryIn = 0;
    for (let i = NUM_COLS - 1; i >= 0; i--) {
      const s = partial1Digits[i] + partial2Digits[i] + carryIn;
      const carryOut = Math.floor(s / 10);
      if (i - 1 >= 0) {
        carryDigits[i - 1] = carryOut;
      }
      carryIn = carryOut;
    }

    resetInputs();
  }

  function checkSolution() {
    let allCorrect = true;

    p1Inputs.forEach(inp => {
      const col = parseInt(inp.dataset.col, 10);
      const expected = partial1Digits[col];
      const value = inp.value === '' ? 0 : parseInt(inp.value, 10);
      inp.classList.remove('correct', 'incorrect');
      if (value === expected) {
        inp.classList.add('correct');
      } else {
        inp.classList.add('incorrect');
        allCorrect = false;
      }
    });

    p2Inputs.forEach(inp => {
      const col = parseInt(inp.dataset.col, 10);
      const expected = partial2Digits[col];
      const value = inp.value === '' ? 0 : parseInt(inp.value, 10);
      inp.classList.remove('correct', 'incorrect');
      if (value === expected) {
        inp.classList.add('correct');
      } else {
        inp.classList.add('incorrect');
        allCorrect = false;
      }
    });

    carryInputs.forEach(inp => {
      const col = parseInt(inp.dataset.col, 10);
      const expected = carryDigits[col];
      const value = inp.value === '' ? 0 : parseInt(inp.value, 10);
      inp.classList.remove('correct', 'incorrect');
      if (value === expected) {
        inp.classList.add('correct');
      } else {
        inp.classList.add('incorrect');
        allCorrect = false;
      }
    });

    resInputs.forEach(inp => {
      const col = parseInt(inp.dataset.col, 10);
      const expected = resultDigits[col];
      const value = inp.value === '' ? 0 : parseInt(inp.value, 10);
      inp.classList.remove('correct', 'incorrect');
      if (value === expected) {
        inp.classList.add('correct');
      } else {
        inp.classList.add('incorrect');
        allCorrect = false;
      }
    });

    if (allCorrect) {
      feedbackEl.textContent = 'Super, alles korrekt gelöst! 🎉';
      feedbackEl.className = 'feedback ok';
    } else {
      feedbackEl.textContent = 'Einige Ziffern sind noch falsch. Versuche es zu verbessern.';
      feedbackEl.className = 'feedback error';
    }
  }

  newBtn.addEventListener('click', generateProblem);
  checkBtn.addEventListener('click', checkSolution);

  buildDigitButtons();
  setupInputClicks();
  generateProblem();
</script>
</body>
</html>
