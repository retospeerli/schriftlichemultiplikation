<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Schriftliche Multiplikation – 3-stellig × 2-stellig</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 2rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 1.4rem;
    }
    .subtitle {
      text-align: center;
      color: #4b5563;
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: auto repeat(5, 2.4rem);
      gap: 0.15rem;
      align-items: center;
      justify-content: center;
      margin-top: 0.6rem;
    }
    .label-cell {
      text-align: right;
      padding-right: 0.3rem;
      font-size: 0.9rem;
      color: #6b7280;
    }
    .digit-cell {
      text-align: center;
      font-size: 1.3rem;
      min-height: 2rem;
    }
    .digit-static {
      display: inline-block;
      min-width: 2rem;
    }
    .line-row {
      grid-column: 1 / span 6;
      border-bottom: 2px solid #111827;
      margin-top: 0.15rem;
    }

    .input-digit {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      border: 2px solid #d1d5db;
      font-size: 1.1rem;
      text-align: center;
      cursor: pointer;
      background: #f9fafb;
    }
    .input-digit:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.35);
    }
    .carry-input {
      width: 1.3rem;
      height: 1.0rem;
      font-size: 0.7rem;
      border-radius: 6px;
      padding: 0;
    }
    .input-digit.correct {
      border-color: #16a34a;
      background: #dcfce7;
    }
    .input-digit.incorrect {
      border-color: #b91c1c;
      background: #fee2e2;
    }

    .buttons-row {
      margin-top: 1.2rem;
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      background: #f9fafb;
      color: #111827;
      transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.05s ease, border-color 0.15s ease;
    }
    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .btn:hover {
      background: #e5e7eb;
      border-color: #9ca3af;
    }
    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }
    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .feedback {
      margin-top: 0.6rem;
      text-align: center;
      min-height: 1.2rem;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .feedback.ok {
      color: #15803d;
    }
    .feedback.error {
      color: #b91c1c;
    }

    /* Popup */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .popup {
      background: #ffffff;
      border-radius: 14px;
      padding: 0.8rem 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 260px;
      width: 100%;
    }
    .popup-title {
      text-align: center;
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }
    .digit-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.3rem;
      margin-bottom: 0.4rem;
    }
    .digit-btn {
      padding: 0.3rem 0;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 1.05rem;
      cursor: pointer;
      transition: background 0.1s ease, transform 0.05s ease;
    }
    .digit-btn:hover {
      background: #e5e7eb;
    }
    .digit-btn:active {
      transform: translateY(1px);
    }
    .popup-footer {
      text-align: center;
    }
    .popup-close {
      padding: 0.25rem 0.8rem;
      border-radius: 999px;
      border: none;
      background: #e5e7eb;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .popup-close:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Schriftliche Multiplikation</h1>
  <div class="subtitle">
    Dreistellige Zahl · zweistellige Zahl – wie bei matheaufgaben.net<br>
    Trage die Zwischenprodukte, Behaltezahlen und das Ergebnis ein.
  </div>

  <div class="layout">
    <!-- Zeile 1: Faktoren untereinander -->
    <div class="label-cell"></div>
    <div class="digit-cell"><span class="digit-static" id="op1-0"></span></div>
    <div class="digit-cell"><span class="digit-static" id="op1-1"></span></div>
    <div class="digit-cell"><span class="digit-static" id="op1-2"></span></div>
    <div class="digit-cell"><span class="digit-static" id="op1-3"></span></div>
    <div class="digit-cell"><span class="digit-static" id="op1-4"></span></div>

    <div class="label-cell">·</div>
    <div class="digit-cell"><span class="digit-static" id="op2-0"></span></div>
    <div class="digit-cell"><span class="digit-static" id="op2-1"></span></div>
    <div class="digit-cell"><span class="digit-static" id="op2-2"></span></div>
    <div class="digit-cell"><span class="digit-static" id="op2-3"></span></div>
    <div class="digit-cell"><span class="digit-static" id="op2-4"></span></div>

    <!-- Strich über den Zwischenprodukten -->
    <div class="line-row"></div>

    <!-- Zeile 3: Zwischenprodukt (Einserstelle des Faktors) -->
    <div class="label-cell"></div>
    <div class="digit-cell"><input class="input-digit p1-input" data-col="0" readonly></div>
    <div class="digit-cell"><input class="input-digit p1-input" data-col="1" readonly></div>
    <div class="digit-cell"><input class="input-digit p1-input" data-col="2" readonly></div>
    <div class="digit-cell"><input class="input-digit p1-input" data-col="3" readonly></div>
    <div class="digit-cell"><input class="input-digit p1-input" data-col="4" readonly></div>

    <!-- Zeile 4: Zwischenprodukt (Zehnerstelle, um eine Stelle nach links versetzt) -->
    <div class="label-cell"></div>
    <div class="digit-cell"><input class="input-digit p2-input" data-col="0" readonly></div>
    <div class="digit-cell"><input class="input-digit p2-input" data-col="1" readonly></div>
    <div class="digit-cell"><input class="input-digit p2-input" data-col="2" readonly></div>
    <div class="digit-cell"><input class="input-digit p2-input" data-col="3" readonly></div>
    <div class="digit-cell"><input class="input-digit p2-input" data-col="4" readonly></div>

    <!-- Zeile 5: Behaltezahlen der Addition (klein, keine Einerstelle) -->
    <div class="label-cell"></div>
    <div class="digit-cell"><input class="input-digit carry-input" data-col="0" readonly></div>
    <div class="digit-cell"><input class="input-digit carry-input" data-col="1" readonly></div>
    <div class="digit-cell"><input class="input-digit carry-input" data-col="2" readonly></div>
    <div class="digit-cell"><input class="input-digit carry-input" data-col="3" readonly></div>
    <div class="digit-cell"><!-- keine Behalte bei Einern --></div>

    <!-- Strich über dem Endergebnis -->
    <div class="line-row"></div>

    <!-- Zeile 6: Endergebnis -->
    <div class="label-cell"></div>
    <div class="digit-cell"><input class="input-digit res-input" data-col="0" readonly></div>
    <div class="digit-cell"><input class="input-digit res-input" data-col="1" readonly></div>
    <div class="digit-cell"><input class="input-digit res-input" data-col="2" readonly></div>
    <div class="digit-cell"><input class="input-digit res-input" data-col="3" readonly></div>
    <div class="digit-cell"><input class="input-digit res-input" data-col="4" readonly></div>
  </div>

  <div class="buttons-row">
    <button class="btn" id="new-btn">Neue Aufgabe</button>
    <button class="btn" id="check-btn">Überprüfen</button>
    <button class="btn" id="done-btn">Erledigt</button>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<!-- Popup -->
<div class="popup-overlay" id="popup-overlay">
  <div class="popup">
    <div class="popup-title">Ziffer auswählen</div>
    <div class="digit-grid" id="digit-grid"></div>
    <div class="popup-footer">
      <button class="popup-close" id="popup-close-btn">Abbrechen</button>
    </div>
  </div>
</div>

<script>
  const NUM_COLS = 5; // wir begrenzen auf fünf Stellen (bis 19999)

  let factor1 = 0;       // dreistellig
  let factor2 = 0;       // zweistellig
  let partial1Digits = [];
  let partial2Digits = [];
  let carryDigits = [];  // Behaltezahlen Addition
  let resultDigits = [];

  let activeInput = null;

  const op1Spans = [...Array(NUM_COLS)].map((_, i) =>
    document.getElementById('op1-' + i)
  );
  const op2Spans = [...Array(NUM_COLS)].map((_, i) =>
    document.getElementById('op2-' + i)
  );

  const p1Inputs = Array.from(document.querySelectorAll('.p1-input'));
  const p2Inputs = Array.from(document.querySelectorAll('.p2-input'));
  const carryInputs = Array.from(document.querySelectorAll('.carry-input'));
  const resInputs = Array.from(document.querySelectorAll('.res-input'));

  const newBtn = document.getElementById('new-btn');
  const checkBtn = document.getElementById('check-btn');
  const doneBtn = document.getElementById('done-btn');
  const feedbackEl = document.getElementById('feedback');

  const popupOverlay = document.getElementById('popup-overlay');
  const digitGrid = document.getElementById('digit-grid');
  const popupCloseBtn = document.getElementById('popup-close-btn');

  /* Hilfsfunktionen */

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function digitsOf(num) {
    const arr = new Array(NUM_COLS).fill(0);
    let n = Math.floor(Math.abs(num));
    for (let i = NUM_COLS - 1; i >= 0; i--) {
      arr[i] = n % 10;
      n = Math.floor(n / 10);
    }
    return arr;
  }

  function digitsCount(num) {
    if (num === 0) return 1;
    let n = Math.floor(Math.abs(num));
    let c = 0;
    while (n > 0) { n = Math.floor(n / 10); c++; }
    return c;
  }

  function displayStaticDigits(spans, digits, numberValue) {
    for (let i = 0; i < NUM_COLS; i++) {
      const isLeadingZero =
        digits[i] === 0 && i < NUM_COLS - digitsCount(numberValue);
      spans[i].textContent = isLeadingZero ? '' : digits[i];
    }
  }

  function resetInputs() {
    const all = [...p1Inputs, ...p2Inputs, ...carryInputs, ...resInputs];
    all.forEach(inp => {
      inp.value = '';
      inp.classList.remove('correct', 'incorrect');
    });
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
  }

  /* Popup */

  function buildDigitButtons() {
    digitGrid.innerHTML = '';
    for (let d = 0; d <= 9; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'digit-btn';
      btn.textContent = String(d);
      btn.addEventListener('click', () => {
        if (activeInput) {
          activeInput.value = String(d);
        }
        hidePopup();
      });
      digitGrid.appendChild(btn);
    }
  }

  function showPopupForInput(inputEl) {
    activeInput = inputEl;
    popupOverlay.style.display = 'flex';
  }

  function hidePopup() {
    popupOverlay.style.display = 'none';
    activeInput = null;
  }

  popupCloseBtn.addEventListener('click', hidePopup);
  popupOverlay.addEventListener('click', (e) => {
    if (e.target === popupOverlay) hidePopup();
  });

  function setupInputClicks() {
    const allInputs = [...p1Inputs, ...p2Inputs, ...carryInputs, ...resInputs];
    allInputs.forEach(inp => {
      inp.addEventListener('click', () => {
        inp.classList.remove('correct', 'incorrect');
        showPopupForInput(inp);
      });
    });
  }

  /* Aufgaben-Generierung */

  function generateProblem() {
    let product;
    do {
      factor1 = randomInt(100, 999);  // dreistellig
      factor2 = randomInt(10, 99);    // zweistellig
      product = factor1 * factor2;
    } while (product > 19999);

    const d1 = digitsOf(factor1);
    const d2 = digitsOf(factor2);

    displayStaticDigits(op1Spans, d1, factor1);
    displayStaticDigits(op2Spans, d2, factor2);

    const ones = factor2 % 10;
    const tens = Math.floor(factor2 / 10);

    const partial1 = factor1 * ones;
    const partial2 = factor1 * tens * 10;

    partial1Digits = digitsOf(partial1);
    partial2Digits = digitsOf(partial2);

    const sum = partial1 + partial2;
    resultDigits = digitsOf(sum);

    // Behaltezahlen der Addition
    carryDigits = new Array(NUM_COLS).fill(0);
    let carryIn = 0;
    for (let i = NUM_COLS - 1; i >= 0; i--) {
      const s = partial1Digits[i] + partial2Digits[i] + carryIn;
      const digit = s % 10;
      const carryOut = Math.floor(s / 10);
      resultDigits[i] = digitsOf(sum)[i];
      if (i - 1 >= 0) {
        carryDigits[i - 1] = carryOut;
      }
      carryIn = carryOut;
    }

    resetInputs();
  }

  /* Lösung prüfen */

  function checkSolution() {
    let allCorrect = true;

    // Zwischenprodukt 1
    p1Inputs.forEach(inp => {
      const col = parseInt(inp.getAttribute('data-col'), 10);
      const expected = partial1Digits[col];
      const value = inp.value === '' ? 0 : parseInt(inp.value, 10);

      inp.classList.remove('correct', 'incorrect');
      if (value === expected) {
        inp.classList.add('correct');
      } else {
        inp.classList.add('incorrect');
        allCorrect = false;
      }
    });

    // Zwischenprodukt 2
    p2Inputs.forEach(inp => {
      const col = parseInt(inp.getAttribute('data-col'), 10);
      const expected = partial2Digits[col];
      const value = inp.value === '' ? 0 : parseInt(inp.value, 10);

      inp.classList.remove('correct', 'incorrect');
      if (value === expected) {
        inp.classList.add('correct');
      } else {
        inp.classList.add('incorrect');
        allCorrect = false;
      }
    });

    // Behaltezahlen Addition
    carryInputs.forEach(inp => {
      const col = parseInt(inp.getAttribute('data-col'), 10);
      const expected = carryDigits[col];
      const value = inp.value === '' ? 0 : parseInt(inp.value, 10);

      inp.classList.remove('correct', 'incorrect');
      if (value === expected) {
        inp.classList.add('correct');
      } else {
        inp.classList.add('incorrect');
        allCorrect = false;
      }
    });

    // Endergebnis
    resInputs.forEach(inp => {
      const col = parseInt(inp.getAttribute('data-col'), 10);
      const expected = resultDigits[col];
      const value = inp.value === '' ? 0 : parseInt(inp.value, 10);

      inp.classList.remove('correct', 'incorrect');
      if (value === expected) {
        inp.classList.add('correct');
      } else {
        inp.classList.add('incorrect');
        allCorrect = false;
      }
    });

    if (allCorrect) {
      feedbackEl.textContent = 'Super, alles korrekt gelöst! 🎉';
      feedbackEl.className = 'feedback ok';
    } else {
      feedbackEl.textContent = 'Einige Ziffern sind noch falsch. Versuche es zu verbessern.';
      feedbackEl.className = 'feedback error';
    }
  }

  /* Erledigt an LearningView melden */

  function markDone() {
    feedbackEl.textContent = 'Aufgabe als erledigt markiert. (LearningView wird informiert, falls eingebunden.)';
    feedbackEl.className = 'feedback ok';

    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          { type: 'lv_task_done', status: 'completed', kind: 'schriftliche_multiplikation_3x2' },
          '*'
        );
      }
    } catch (e) {
      console.error('Senden an Parent fehlgeschlagen:', e);
    }
  }

  /* Events */

  newBtn.addEventListener('click', generateProblem);
  checkBtn.addEventListener('click', checkSolution);
  doneBtn.addEventListener('click', markDone);

  buildDigitButtons();
  setupInputClicks();
  generateProblem();
</script>
</body>
</html>
